name: Build Dyna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          WRAPPER=$(find . -type f -name gradlew -not -path '*/.git/*' -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: File gradlew tidak ditemukan."
            echo "Pastikan Gradle Wrapper (gradlew, gradlew.bat, dan folder gradle/wrapper) sudah di-commit ke repository."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project ditemukan di: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dyna-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
