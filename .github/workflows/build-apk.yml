name: Build Dyna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Gradle version
        id: gradle_version
        shell: bash
        run: |
          FILE="gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE tidak ditemukan."
            echo "Periksa isi folder gradle di repository."
            exit 1
          fi

          URL=$(grep '^distributionUrl=' "$FILE" | cut -d= -f2-)
          VERSION=$(echo "$URL" | sed -E 's/.*gradle-([0-9][0-9.]*)-(bin|all)\.zip.*/\1/')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Versi Gradle tidak dapat dibaca dari $FILE"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Gradle version: $VERSION"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_version.outputs.version }}

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dyna-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
